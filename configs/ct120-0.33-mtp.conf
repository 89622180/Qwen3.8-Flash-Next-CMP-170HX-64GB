# CT120 — Qwen3.8-Flash-Next on vLLM 0.33.0, MTP arm (prepared 2026-11-04)
# Container is STOPPED: one CMP 170HX, so only CT103 serves. CT120 carries the same
# /root/v33 thin venv + /root/vllm-033work (byte-identical site-packages/vllm vs the
# worktree, diff -rq -x __pycache__ = empty), so starting it is:
#   pct start 120 && pct exec 120 -- systemctl start qwen38-032-test.service
#
# Measured on 0.33 (ladder 2048-in/256-out, 3 paired reps, preempt=0, gate MainPID==owner):
#   k=5 (was shipped): C1 decode 154.7/138.5/146.2 = mean 146.5, C2 agg 180.6, C4 277.6,
#                      GPU KV 526,649 tok (2.01x @262,144)
#   k=4 (now shipped): C1 decode 153.9/136.7/147.3 = mean 146.0, C2 agg 180.8, C4 278.4,
#                      GPU KV 548,787 tok (2.09x @262,144)
# Paired per-rep 2-1 for k=5 -> decode is a tie, so pick the depth that keeps the pool:
# k=4 buys +22,138 tokens and leaves the QSA ring at capacity 8 instead of 16.

# ---- qwen38-032-test.service.d/perf.conf (0.32-era, unchanged) ----
[Service]
Environment=QWEN_GPU_MEMORY=0.975
# 2.00x needs 524,288 tok; util-derived sizing gives 521,926 (1.99x). Pin the pool in
# bytes instead of raising util: byte-pinning skips the memory-profiling pass, so the
# peak-activation reservation that blocked util=0.976 is not carved off the card.
Environment=QWEN_KV_BYTES=10200547328
ExecStartPre=/bin/sh -c 'rm -f /dev/shm/vllm_offload_*.mmap'

# ---- qwen38-032-test.service.d/zz-v033.conf ----
Environment=VLLM_VENV=/root/v33
Environment=VLLM_WORKDIR=/root/vllm-033work
Environment=QWEN_KV_DTYPE=fp8
Environment=QWEN_MTP=4

# Cost of the pin: QWEN_KV_BYTES no longer auto-shrinks with the weights. If a peer
# takes part of the card, or the checkpoint changes, recompute the number before
# blaming the engine for a refused boot. Boot markers that confirm the pin took:
#   Initial free memory 63.0 GiB, reserved 9.5 GiB memory for KV Cache as specified
#   by kv_cache_memory_bytes config and skipped memory profiling

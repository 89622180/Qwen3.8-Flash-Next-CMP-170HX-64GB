# CT103 — Qwen3.8-Flash-Next on vLLM 0.33.0, DFlash2 arm (shipped 2026-11-04)
# Effective config = the unit's own Environment= lines (unchanged since the 0.32 port)
# plus these two drop-ins, loaded in filename order.
#
# Measured this session: GPU KV 553,415 tok (2.11x @262,144), Available KV 10.43 GiB,
# util 0.9750 == 0.9523 without cudagraph profiling, model load 47.33 GiB,
# boot to /health ~168 s, preempt=0 across the whole ladder.

# ---- qwen38-032-test.service.d/zz-dflash2.conf ----
[Service]
Environment=QWEN_SPEC=dflash2
Environment=QWEN_SPEC_TOKENS=4
Environment=QWEN_SEQS=8
Environment=QWEN_GPU_MEMORY=0.975
Environment=QWEN_SPEC_ATTN_BACKEND=TRITON_ATTN
Environment=QWEN_SPEC_KV_DTYPE=bfloat16
Environment=QWEN_SPEC_MODEL=/models/incoai-Qwen3.8-Flash-Next-DFlash2-W8A16G128-GPTQ
Environment=VLLM_SW_BLOCK_SIZE=1072

# vLLM leaves its CPU-KV mmap behind when the engine aborts and ExecStopPost
# misses it, so a restarted boot cannot fit the 16 GiB region in the 48 GiB
# /dev/shm. systemd does not glob in Exec* lines, hence the shell wrapper.
ExecStartPre=/bin/sh -c 'rm -f /dev/shm/vllm_offload_*.mmap'

# ---- qwen38-032-test.service.d/zz-v033.conf ----
# 0.33's QSA kernel reads an fp8 cache only as e4m3: either the native
# float8e4nv view on sm_89+ or the new uint8 byte-decode path below it
# (ops/qsa.py:_maybe_dequant; a typed cache asserts float8_e4m3fn at :697).
# So the 0.32 arm's fp8_e5m2 view has no read path here and the KV dtype moves
# to upstream's e4m3 route. Decode measured the same as 0.32 (162.8 vs 163.8
# tok/s C1), prefill/TTFT ~17 % worse.
# LD_LIBRARY_PATH is deliberately NOT overridden: torch is still the 0.32 venv's,
# so its cu13 lib dir must stay on the path.
Environment=VLLM_VENV=/root/v33
Environment=VLLM_WORKDIR=/root/vllm-033work
Environment=QWEN_KV_DTYPE=fp8


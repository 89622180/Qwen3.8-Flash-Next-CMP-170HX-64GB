[Service]
# FlashStates frontier checkpoints + GreedyDual-Size prefix-cache eviction
# (docs/flashstates-frontier-on-ct120.md). Opt-in, NOT shipped: it cannot run
# with MTP on this arm because our QSA ring declares resume_catchup="prefill"
# (models/qwen4_exp/common/qsa_cache.py:870), which the frontier gate refuses
# under speculative decoding. Installing this file means dropping MTP, i.e.
# giving up the ~2x decode that zz-v033.conf's QWEN_MTP=4 buys.
#
# GPU0 = PCI 01:00.0; CT103 keeps 07:00.0. CUDA_DEVICE_ORDER=PCI_BUS_ID is
# already in the unit, so index 0 == 01:00.0.
Environment=CUDA_VISIBLE_DEVICES=0
# frontier checkpoints cannot coexist with --enable-mamba-shared-prefix-checkpoint
Environment=QWEN_MAMBA_SHARED_PREFIX=0
# no KV connector -> the kv_role/kv_load_failure_policy gate does not apply
Environment=QWEN_KV_TIER_CPU_GB=0
Environment=QWEN_KV_TIER_NVME=0
Environment=QWEN_MTP=0
# measured 2026-11-11: KV pool 701,869 tokens (vs shipped 548,787 with MTP k=4),
# cold prefill unchanged, warm-turn TTFT 0.156-0.446 s depending on whether the
# resume landed on a frontier.
Environment=QWEN_EXTRA_ARGS="--mamba-frontier-checkpoint --prefix-cache-eviction gds --prefill-cost-coefficients 1.862e-5 3.33e-6"

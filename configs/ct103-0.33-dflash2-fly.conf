# CT103 — OPT-IN, not shipped by default (2026-11-04)
#
# vLLM 0.33's FLy rejection sampling on the DFlash2 arm. Measured in an interleaved
# A-B-A-B run (3 pairs, one boot each, decode = 6 paired seeds x 1024 out):
#   pair 1  fly 151.4 vs standard 139.2  (+8.8 %)
#   pair 2  fly 156.3 vs standard 140.9  (+10.9 %)
#   pair 3  fly 152.8 vs standard 141.1 on the non-looping runs (+8.3 %)
# prefill and the KV pool are unchanged (553,415 tok / 2.11x), preempt=0.
#
# WHY IT IS NOT ON BY DEFAULT: the engine itself warns
#   "FLy verification is a lossy speculative decoding method and may degrade model outputs"
# - it accepts draft tokens that standard rejection sampling would drop (acc_len shifts up).
# A 10-question factual probe scored 8/10 on both arms, but only 2 of 10 answers were
# byte-identical, so "same score" is not "same output". See
# docs/0.33-new-features-matrix.md §2.
#
# Enable:  cp configs/ct103-0.33-dflash2-fly.conf \
#            /etc/systemd/system/qwen38-032-test.service.d/zz-fly.conf
#          systemctl daemon-reload && systemctl restart qwen38-032-test.service
# Disable: rm that file, daemon-reload, restart.
[Service]
Environment=QWEN_REJECTION_METHOD=fly
Environment=QWEN_FLY_WINDOW=2

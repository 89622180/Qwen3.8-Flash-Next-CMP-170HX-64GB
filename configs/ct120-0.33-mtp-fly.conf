# CT120 — OPT-IN, not shipped by default (2026-11-04)
#
# vLLM 0.33's FLy rejection sampling on the native MTP arm (k=4). Measured in an
# interleaved A-B-A-B run (3 pairs, one boot each, decode = 6 paired seeds x 1024 out):
#   pair 1  fly 157.0 vs standard 136.3  (+15.1 %)
#   pair 2  fly 161.8 vs standard 139.5  (+16.0 %)
#   pair 3  fly 175.1 vs standard 134.8  (+29.9 %)
#   pooled  fly 162.9 vs standard 137.2  (+18.8 %), fly wins 16 of 18 paired seeds
# Same conclusion after stratifying out acc_len >= 4.1 runs from BOTH arms: +18.7 %.
# acc_len mean shifts 3.023 -> 3.739 (+23.7 %) - that is where the gain comes from.
# Prefill is unchanged (3334-3368 vs 3334-3360 tok/s across the pairs) and every boot
# reports the same pool: GPU KV cache size 548,787 tokens / 2.09x, preempt=0.
#
# WHY IT IS NOT ON BY DEFAULT: the engine warns
#   "FLy verification is a lossy speculative decoding method and may degrade model outputs"
# and on this arm the 10-question factual probe scored 8/10 standard vs 9/10 fly while
# only 3 of 10 answers were byte-identical. "Score didn't drop" is not "output unchanged".
# See docs/0.33-features-on-ct120-mtp.md §1-2.
#
# This file relies on serve.sh's QWEN_REJECTION_METHOD / QWEN_FLY_WINDOW hooks, which
# since the 6th round feed BOTH speculative branches (dflash and mtp). It does NOT need
# QWEN_DRAFT_LM_HEAD: that field passes the MTP gate but dies at weight load on sm_80
# (MarlinFP8 is W8A16 weight-only; FP8 PTPC needs SM89+), so there is nothing to
# combine it with on this card.
#
# Enable:  cp configs/ct120-0.33-mtp-fly.conf \
#            /etc/systemd/system/qwen38-032-test.service.d/zz-fly.conf
#          systemctl daemon-reload && systemctl restart qwen38-032-test.service
# Disable: rm that file, daemon-reload, restart.
[Service]
Environment=QWEN_REJECTION_METHOD=fly
Environment=QWEN_FLY_WINDOW=2
